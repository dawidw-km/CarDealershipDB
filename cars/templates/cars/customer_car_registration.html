<h1>Register New Car</h1>

{% if errors %}
    <div>
            <h2>Errors:</h2>
        <ul>
            {% for field, field_errors in errors.items %}
                {% for error in field_errors %}
                    <li>{{ field }}: {{ error }}</li>
                {% endfor %}
            {% endfor %}
        </ul>
    </div>
{% endif %}

<form method="post">
    {% csrf_token %}

    <div>
        <label for="brand">Brand:</label>
        <input
            type="text"
            id="brand"
            name="brand"
        >
    </div>

    <div>
        <label for="model">Model:</label>
        <input
            type="text"
            id="model"
            name="model"
        >
    </div>

    <div>
        <label for="color">Color:</label>
        <input
            type="text"
            id="color"
            name="color"
        >
    </div>

    <div>
        <label for="vehicle_type">Vehicle Type:</label>
        <select id="vehicle_type" name="vehicle_type">
            <option value="sedan">Sedan</option>
            <option value="hatchback">Hatchback</option>
            <option value="suv">SUV</option>
            <option value="coupe">Coupe</option>
            <option value="wagon">Wagon</option>
            <option value="convertible">Convertible</option>
            <option value="van">Van</option>
            <option value="pickup">Pickup</option>
        </select>
    </div>

    <div>
        <label for="year">Year:</label>
        <input
            type="number"
            id="year"
            name="year"
        >
    </div>

    <div>
        <label for="vin">VIN:</label>
        <input
            type="text"
            id="vin"
            name="vin"
        >
    </div>

    <div>
        <label for="mileage">Mileage:</label>
        <input
            type="number"
            id="mileage"
            name="mileage"
        >
    </div>

    <div>
        <label for="fuel_type">Fuel Type:</label>
        <select id="fuel_type" name="fuel_type">
            <option value="gasoline">Gasoline</option>
            <option value="diesel">Diesel</option>
            <option value="electric">Electric</option>
            <option value="hybrid">Hybrid</option>
            <option value="plug_in_hybrid">Plug-in Hybrid</option>
            <option value="other">Other</option>
        </select>
    </div>

    <div>
        <label for="transmission">Transmission:</label>
        <select id="transmission" name="transmission">
            <option value="manual">Manual</option>
            <option value="automatic">Automatic</option>
            <option value="semi_automatic">Semi Automatic</option>
        </select>
    </div>

    <div>
        <label for="vehicle_condition">Vehicle Condition:</label>
        <select id="vehicle_condition" name="vehicle_condition">
            <option value="new">New</option>
            <option value="used">Used</option>
        </select>
    </div>

    <div>
        <label for="accident_status">Accident Status:</label>
        <select id="accident_status" name="accident_status">
            <option value="accident_free">Accident Free</option>
            <option value="after_impact">After Impact</option>
        </select>
    </div>

    <div>
        <label for="listing_price">Listing Price:</label>
        <input
            type="number"
            step="0.01"
            id="listing_price"
            name="listing_price"
        >
    </div>

    <div>
        <label for="description">Description:</label>
        <textarea
            id="description"
            name="description"
            rows="5"
            cols="50"
        ></textarea>
    </div>

    <div>
        <input type="submit" value="Register Car">
    </div>
</form>

<p>
    <a href="{% url 'customer-profile' %}">Back to profile</a>
</p>
