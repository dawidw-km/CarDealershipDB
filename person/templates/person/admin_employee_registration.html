<!-- person/templates/person/admin_employee_registration.html -->

<h1>Admin Employee Registration</h1>

<form method="post">
    {% csrf_token %}

    <input type="text" name="first_name" placeholder="First Name">
    <input type="text" name="last_name" placeholder="Last Name">
    <input type="email" name="email" placeholder="Email">
    <input type="text" name="phone_number" value="+48" placeholder="Phone Number">
    <select name="role" id="role">
        <option value="worker">Worker</option>
        <option value="admin">Admin</option>
    </select>
    <input type="date" name="hire_date">
    <input type="text" name="salary" placeholder="Salary">
    <input type="password" name="password" placeholder="Password">

    <button type="submit">Register</button>
</form>

<a href="{% url 'employee-profile' %}"><button>My Profile</button></a>
<a href="{% url 'employee-list-template' %}"><button>Employee List</button></a>
{% if errors %}
    <ul>
        {% for field, error_list in errors.items %}
            {% for error in error_list %}
            <li>{{field}}: {{error}}</li>
        {% endfor %}
    {% endfor %}
</ul>
{% endif %}
