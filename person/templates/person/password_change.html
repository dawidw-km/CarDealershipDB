<!-- person/templates/person/customer_password_change.html -->

<h1>Change Password</h1>

<form method="post">
    {% csrf_token %}

    <input
    type="password"
    name="old_password"
    placeholder="Current Password"
    >

    <input
    type="password"
    name="new_password"
    placeholder="New Password"
    >

    <button type="submit">Change Password</button>

</form>

{% if errors %}
    <p>{{ errors }}</p>
{% endif %}
