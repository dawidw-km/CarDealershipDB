<h1>Change Password</h1>

<form method="post">
    {% csrf_token %}

    <input
    type="password"
    name="old_password"
    placeholder="Current Password"
    >

    <input
    type="password"
    name="new_password"
    placeholder="New Password"
    >

    <button type="submit">Change Password</button>

</form>

{% if request.user.customer_profile %}
    <a href="{% url 'customer-profile' %}">Back to Profile</a>
{% elif request.user.employee_profile %}
    <a href="{% url 'employee-profile' %}">Back to Profile</a>
{% endif %}

{% if errors %}
    <p>{{ errors }}</p>
{% endif %}
